# 打 tag（v*）时在 Windows / macOS 构建机分别构建安装包并发布 GitHub Release
name: build-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
            name: windows
          - os: macos-latest
            args: --mac dmg zip
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npx electron-builder ${{ matrix.args }}
        env:
          # CI 构建机在海外：直接用官方源下载 Electron/工具链（国内镜像反而会拖慢或失败）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.zip
