# 打 tag（v*）时在 Windows / macOS 构建机分别构建安装包并发布 GitHub Release
name: build-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
            name: windows
          - os: macos-latest
            args: --mac dmg zip
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove CN mirror config (CI runners are overseas)
        run: node -e "try{require('fs').unlinkSync('.npmrc')}catch(e){}"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        # --publish never：禁用 tag 触发的隐式发布（发布由下方 action-gh-release 完成）
        run: node node_modules/electron-builder/out/cli/cli.js ${{ matrix.args }} --publish never
        env:
          # CI 构建机在海外：直接用官方源下载 Electron/工具链
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.zip
